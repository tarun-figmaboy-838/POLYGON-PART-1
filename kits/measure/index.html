<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measuring Kit</title>
<!--
  MEASURING KIT — Swiftee measures the SIDES (tape walk) and the ANGLES (protractor walk),
  from "Swiftee & the Polygons", Part 1. Nothing is copied: this page runs the lesson's own
  code and art in ../../part1-swiftee-lesson/ (the <base> below), so it always shows exactly
  what the game does.

  THE CODE IT RUNS (load in this order):
    src/core/polygon-math.js               the polygon, its sides and angles (Poly)
    src/fx/snowflake.js                    the sparkle on each reading
    src/character/swiftee-frames.js        Swiftee's sprite sheets
    src/character/measuring-frames.js      the tape walk  (assets/swiftee/swiftee-measuring.webp)
    src/character/angle-measuring-frames.js the protractor walk (assets/swiftee/swiftee-angle-intact-v4.webp)
    src/game/card-frame.js                 the ice card the shape sits on
    src/game/stage.js                      Stage: draws the shape, runs both walks

  HOW TO DRIVE IT (the same calls the game makes):
    window.Swiftee = { el: <the presenter element> };   // hidden while he walks, shown after
    window.Juice   = { reducedMotion: false };          // true: the same readings, no walk
    Stage.mount(document.querySelector('#stage'));

    // SIDES: the child taps each side; Swiftee walks it with the tape, then its length shows.
    Stage.apply({ kind: 'polygon', sides: 5, panel: 'right' });
    Stage.waitFor({ type: 'tap-each', targets: 'sides', count: 5 }).then(done);

    // ANGLES: Swiftee walks round the corners with the protractor, reading each one.
    Stage.apply({ kind: 'polygon', sides: 5, room: 'measure' });
    Stage.waitFor({ type: 'tap-each', targets: 'angles', count: 5, auto: true, lead: 0 }).then(done);

    Stage.state.measure.sides / .angles   the indexes measured so far, in order
    Calling Stage.apply() again cancels a walk cleanly (no reading appears on the next scene).

  Its tests: part1-swiftee-lesson/tests/measuring.browser.js and tests/angles.browser.js.
-->
<base href="../../part1-swiftee-lesson/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1c2a4a; --sans: "Nunito", "Segoe UI", system-ui, sans-serif; --bar: 64px; }
  html, body { margin: 0; height: 100%; background: #a9d6f4; font-family: var(--sans); color: var(--ink); overflow: hidden;
    user-select: none; -webkit-user-select: none; }
  #game { position: fixed; left: 0; right: 0; bottom: 0; top: var(--bar); background: #5fbdfa; }
  .swiftee { position: absolute; }

  /* the kit's controls (not part of the game) */
  .kit-bar { position: fixed; top: 0; left: 0; right: 0; min-height: var(--bar); box-sizing: border-box; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px;
    background: #0f2a4f; color: #eaf6ff; font-size: 15px; }
  .kit-bar b { font-weight: 800; margin-right: 4px; }
  .kit-bar button, .kit-bar select { font: 800 15px var(--sans); border-radius: 999px; border: 0; padding: 9px 16px; cursor: pointer; }
  .kit-bar button { background: #ffc23c; color: #1c2a4a; }
  .kit-bar button:hover { background: #ffd56e; }
  .kit-bar button:focus-visible, .kit-bar select:focus-visible { outline: 3px solid #4be0ff; outline-offset: 2px; }
  .kit-bar select { background: #eaf6ff; color: #1c2a4a; padding: 9px 12px; }
  .kit-bar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  #status { margin-left: auto; font-weight: 700; color: #bfe6ff; }
  @media (max-width: 760px) { #status { margin-left: 0; width: 100%; } }

  /* ---- the game's own stage styles (index.html), unchanged ---- */
  #stage { position: absolute; inset: 0; z-index: 1; }
  .swiftee { z-index: 3; }
  #stage .touchable { transition: filter .14s ease, translate .14s ease; }
  #stage .touchable:hover { filter: drop-shadow(0 0 7px rgba(255, 181, 21, .9)); translate: 0 -3px; }
  #stage .touchable:active { filter: drop-shadow(0 0 3px rgba(255, 181, 21, .7)); translate: 0 3px; }
  #stage .zone.touchable:hover { filter: none; translate: 0; }
  #stage .card.touchable:hover, #stage .card.touchable:active { translate: 0; }
  #stage .edge.hint { stroke: transparent; }
  #stage .side-todo { stroke-opacity: .35; }
  @media (prefers-reduced-motion: reduce) {
    #stage .side-todo { animation: none; stroke-opacity: .6; }
  }
  .swiftee.air { animation: hoverBob 2.6s ease-in-out infinite; }
  #stage .knob.hint { transform-box: fill-box; transform-origin: center; filter: drop-shadow(0 0 4px rgba(75, 224, 255, .85)); }
  #stage .knob.breathe { transform-box: fill-box; transform-origin: center; animation: knobBreathe 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    #stage .knob.breathe { animation: none; filter: drop-shadow(0 0 4px rgba(75, 224, 255, .85)); }
  }
  #stage .angle-todo { opacity: .6; }
  #stage .angle-todo[data-todo="1"] { animation-delay: .22s; }
  #stage .angle-todo[data-todo="2"] { animation-delay: .44s; }
  #stage .angle-todo[data-todo="3"] { animation-delay: .66s; }
  #stage .angle-todo[data-todo="4"] { animation-delay: .88s; }
  @media (prefers-reduced-motion: reduce) {
    #stage .angle-todo { animation: none; opacity: .9; }
  }
  #stage .focus-ring { transition: opacity 320ms ease; filter: drop-shadow(0 0 6px rgba(255, 194, 60, .8)); }
  @media (hover: hover) and (pointer: fine) {
    #stage .card .shape-card, #stage .choice { transform-box: fill-box; transform-origin: center; transition: transform .16s ease-out; }
    #stage .card:not(.card-off):hover .shape-card, #stage .choice:hover { transform: scale(1.03); }
    #stage .card:not(.card-off):active .shape-card, #stage .choice:active { transform: scale(1.0); transition-duration: .06s; }
  }
  #stage .teach-sheet { position: absolute; inset: 0; z-index: 2; pointer-events: auto; background: rgba(2, 10, 26, 0); -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); transition: background .35s ease, -webkit-backdrop-filter .35s ease, backdrop-filter .35s ease; }
  #stage .teach-sheet.on { background: rgba(2, 10, 26, .42); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  #stage .teach-sheet > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #stage .teach-ring { transform-box: fill-box; transform-origin: center; animation: teachRing 1.1s ease-in-out infinite; }
  #stage .teach-spark { transform-box: fill-box; transform-origin: center; animation: teachSpark .9s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    #stage .teach-ring, #stage .teach-spark { animation: none; }
    #stage .teach-sheet { transition: none; }
  }
  #stage .card.card-off { opacity: .5; filter: grayscale(.55); pointer-events: none; transition: opacity .35s ease, filter .35s ease; }
  #stage .zone.hint { filter: drop-shadow(0 0 8px rgba(255, 255, 255, .6)); }
  #stage .zone.landed { animation: zoneLand .65s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .swiftee.air { animation: none; }
    #stage .zone.hint, #stage .zone.landed { animation: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage .touchable { transition: none; }
    #stage .touchable:hover { translate: 0; }
  }
  @keyframes hoverBob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
  @keyframes knobBreathe { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(75, 224, 255, 0)); } 50% { transform: scale(1.3); filter: drop-shadow(0 0 6px rgba(75, 224, 255, .95)); } }
  @keyframes teachRing { 0%, 100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.4); opacity: .5; } }
  @keyframes teachSpark { 0% { transform: scale(0); opacity: 0; } 40% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(.6); opacity: 0; } }
  @keyframes zoneLand { 0% { filter: drop-shadow(0 0 0 #fff) brightness(1); } 30% { filter: drop-shadow(0 0 24px #fff) brightness(1.2); } 100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)) brightness(1); } }
</style>
</head>
<body>
<div class="kit-bar" role="toolbar" aria-label="Measuring kit">
  <b>Measuring Kit</b>
  <select id="shape" aria-label="Shape">
    <option value="3">Triangle</option>
    <option value="4">Quadrilateral</option>
    <option value="5" selected>Pentagon</option>
    <option value="6">Hexagon</option>
  </select>
  <button id="sides" type="button">Measure the sides</button>
  <button id="angles" type="button">Measure the angles</button>
  <label><input id="still" type="checkbox"> Reduced motion</label>
  <span id="status" aria-live="polite">Pick one to start.</span>
</div>
<div id="game"><div id="stage"></div><div class="swiftee"></div></div>

<script src="src/core/polygon-math.js"></script>
<script src="src/fx/snowflake.js"></script>
<script src="src/character/swiftee-frames.js"></script>
<script src="src/character/measuring-frames.js"></script>
<script src="src/character/angle-measuring-frames.js"></script>
<script src="src/game/card-frame.js"></script>
<script src="src/game/stage.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  window.Swiftee = { el: document.querySelector('.swiftee') };
  window.Juice = { reducedMotion: false };
  Stage.mount($('stage'));
  // the game area starts where the controls end, however many lines they wrap to
  function fitBar() { document.documentElement.style.setProperty('--bar', document.querySelector('.kit-bar').offsetHeight + 'px'); }
  fitBar(); addEventListener('resize', fitBar);

  var run = 0, timer = null;
  function say(t) { $('status').textContent = t; }
  function start(what) {
    var n = +$('shape').value, my = ++run, isSides = what === 'sides';
    clearInterval(timer);
    Juice.reducedMotion = $('still').checked;
    if (isSides) Stage.apply({ kind: 'polygon', sides: n, panel: 'right' });
    else Stage.apply({ kind: 'polygon', sides: n, room: 'measure' });
    say(isSides ? 'Tap each side to measure it (0 of ' + n + ').' : 'Swiftee is measuring the angles (0 of ' + n + ').');
    timer = setInterval(function () {
      var m = Stage.state && Stage.state.measure, k = m && m[what] ? m[what].length : 0;
      if (my === run) say(isSides ? 'Tap each side to measure it (' + k + ' of ' + n + ').' : 'Swiftee is measuring the angles (' + k + ' of ' + n + ').');
    }, 200);
    var spec = isSides ? { type: 'tap-each', targets: 'sides', count: n }
                       : { type: 'tap-each', targets: 'angles', count: n, auto: true, lead: 0 };
    Stage.waitFor(spec).then(function () {
      if (my !== run) return;
      clearInterval(timer);
      say('All ' + n + (isSides ? ' sides' : ' angles') + ' measured.');
      document.documentElement.dataset.done = what;
    });
    delete document.documentElement.dataset.done;
  }
  $('sides').onclick = function () { start('sides'); };
  $('angles').onclick = function () { start('angles'); };
  window.MeasuringKit = { start: start };
  start('sides');
})();
</script>
</body>
</html>
