<script>  (function (w) {
    var F = w.ImgFormat = { avif: false, settled: false }, done = null;

    function settle(ok) {
      if (F.settled) return;
      F.settled = true; F.avif = !!ok;
      if (done) done(F.avif);
    }
    try {
      if (/[?&]avif=0\b/.test(location.search) || !(w.CSS && CSS.supports &&
          CSS.supports('background-image', 'image-set(url("a.avif") type("image/avif"))'))) { settle(false); return; }
      var img = new Image();
      img.onload = function () {
        // 2x1: an opaque red pixel and a transparent one, encoded the way the twins are
        var ok = img.width === 2 && img.height === 1;
        try {
          var c = document.createElement('canvas'); c.width = 2; c.height = 1;
          var x = c.getContext('2d'); x.drawImage(img, 0, 0);

          ok = ok && p[0] > 200 && p[1] < 60 && p[2] < 60 && p[3] > 200 && p[7] < 60;
        } catch (e) { /* no canvas to read: the size is the answer */ }
        settle(ok);
      };

      img.src = 'data:image/avif;base64,AAAAHGZ0eXBhdmlmAAAAAG1pZjFhdmlmbWlhZgAAAXBtZXRhAAAAAAAAACFoZGxyAAAAAAAAAABwaWN0AAAAAAAAAAAAAAAAAAAAADRpbG9jAAAAAERAAAIAAQAAAAABlAABAAAAAAAAAC0AAgAAAAABwQABAAAAAAAAABcAAAA4aWluZgAAAAAAAgAAABVpbmZlAgAAAAABAABhdjAxAAAAABVpbmZlAgAAAAACAABhdjAxAAAAAA5waXRtAAAAAAABAAAAr2lwcnAAAACKaXBjbwAAAAxhdjFDgSACAAAAABRpc3BlAAAAAAAAAAIAAAABAAAAEHBpeGkAAAAAAwgICAAAAAxhdjFDgQAcAAAAAA5waXhpAAAAAAEIAAAAOGF1eEMAAAAAdXJuOm1wZWc6bXBlZ0I6Y2ljcDpzeXN0ZW1zOmF1eGlsaWFyeTphbHBoYQAAAAAdaXBtYQAAAAAAAAACAAEDgQIDAAIEhAIFhgAAABppcmVmAAAAAAAAAA5hdXhsAAIAAQABAAAATG1kYXQSAAoHOAAm0BDQaTIgGUJjBMAANAIIEOwnlGVLAN8Pvl+zUWUrjSmOji/1m1MSAAoEGAAuVTINGAAAARAjRj1vSa0F9w==';
    } catch (e) { settle(false); }

</script>

<body>
  <div class="stage-wrap">

              </button>
              <button class="icon-btn" id="btn-sound2" type="button" aria-label="Sound" data-i18n-aria="soundButton" aria-pressed="true" data-icon="sound-on">

        </div>

          </button>

            ><i></i><i></i><i></i><i></i><i></i><i></i><i></i

      </div>

  <!-- HOW THE CODE IS LOADED, and why it is not just one script tag.

       The game is written as ES modules, and a browser fetches a module with CORS even
       from a file:// page — which file:// refuses outright:

         Access to script at 'file:///.../js/main.js' from origin 'null' has been
         blocked by CORS policy: Cross origin requests are only supported for protocol
         schemes: chrome, chrome-untrusted, data, http, https.

       So opening this file by double-clicking it used to give a permanently blank dark
       stage, with the real reason only visible in the console. A classic <script> has
       no such restriction, so off the disk we load the concatenated build instead.

       Over http:// nothing changes: the modules are loaded, exactly as before, so the
       files in js/ stay the source of truth and editing them takes effect immediately.
       The bundle is a build artefact (tools/build-bundle.mjs) and a test fails if it
       has drifted from the modules, so the two can never silently disagree.

       `nomodule` is not the mechanism here — that targets browsers WITHOUT module
       support, which is a different question from the page's origin. -->
  <!-- THE SOUND KIT. A classic script that defines window.SFX: forty-five synthesised
       effects with measured trims, per-sound voice caps, pitch jitter and a musical
       key. It has no imports and loads the same way on file:// and http://, so it
       sits outside the module/bundle switch below. The engine reaches it through
       AudioManager.kit() and keeps its own palette as the fallback. -->
  <!-- THE WORDS, in the language the address asks for (?lan=): polygon-locales.json as a script, and
       the code that reads it — the lesson's own (part1-swiftee-lesson/tools/build-locales.js copies
       both). Classic scripts, before the game's modules, which ask them what to show. -->
  <script src="js/locales.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/juice.js"></script>
  <script>    (function () {
      var s = document.createElement('script');
      if (location.protocol === 'file:') {
        s.src = 'js/game.bundle.js';
      } else {
        s.type = 'module';
        s.src = 'js/main.js';
      }
      document.head.appendChild(s);
    })();
  
</script>
