<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Momo Jump Kit</title>
<!--
  MOMO JUMP KIT — Momo's jump from Frozen Rush (Part 2), on its own, to copy into another game.

  WHERE IT COMES FROM (part2-frozen-rush/)
    game/js/engine.js
      CFG ................ surfaceY, mammothX, runSpeed, gravity, jumpVel, coyoteMs, bufferMs,
                           jumpLead, jumpLeadBackS, leadBackMax, sprite { cw, ch, cols, baseGap }
      character 'mammoth'  scale 1.75, stride 1120, frames { run: 36, jump: 24 }, sheets
      PlayerController ... requestJump(), canJump(), doJump(), update() (the arc, the landing,
                           the ease back to the mark, the buffered jump, the landing's stride
                           match), the squash / tilt / airSq easing, draw() (frame choice and
                           the foot-line transform)
      Particles.poof() ... the dust at take-off and touchdown
    tools/build-jump-cycle.mjs  builds the sheet from Momo's 36-frame GIF (art-source/gif/…-6-2.gif):
                           cells 0–9 are the named poses (idle, crouch, launch, rise, apex, fall,
                           preLand, land, absorb, alert), cells 10–23 the unbroken take-off,
                           flight and landing (GIF frames 14–27), all at one scale on one foot line.

  FILES TO COPY
    game/assets/char/mammoth-jump-v2.webp   24 cells, 6 across, 420 x 320 each
    game/assets/char/mammoth-run.webp       36 cells, 6 across, 420 x 320 each
    (hi-DPI twins at 1.5x, 630 x 480 cells: game/assets/char/hd/ — set CELL_K = 1.5 to use them)

  HOW IT PLAYS
    RUN ─tap→ JUMP_START (cell 12, 0.08 s, stretch 1.13) → JUMP_AIR (cells 12–20, advanced by
    vertical speed, not a clock) → LAND (cells 21–23, 40 ms each, squash 0.82) → RUN again on the
    run cell nearest the landing pose (24 of 36).
    The arc: 360 px apex, 1.05 s in the air, integrated with the average velocity so it does not
    depend on the frame rate. During the leap Momo travels 300 px forward, then eases back to his
    mark with smootherstep, never faster than 60% of the run speed, so he never slides backwards.
    A tap up to 250 ms before landing is kept and fires on touchdown.

  THE SCENE is 1920 x 1080 with the snow at y = 840, fitted to the window; everything below is in
  those units.
-->
<style>
  :root {
    --sky-top: #bfe6ff; --sky-low: #eaf7ff; --ink: #183d58; --paper: #ffffffcc;
    --page: #cfe9fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #0f2233; --ink: #e8f4ff; --paper: #12283bcc; }
  }
  :root[data-theme="dark"] { --page: #0f2233; --ink: #e8f4ff; --paper: #12283bcc; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink);
    font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: manipulation; }
  .hud { position: fixed; left: 16px; top: 16px; right: 16px; display: flex; gap: 12px;
    flex-wrap: wrap; align-items: center; pointer-events: none; }
  .hud > * { background: var(--paper); border-radius: 12px; padding: 8px 12px; }
  .hud code { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .hud button { pointer-events: auto; border: 0; border-radius: 10px; padding: 8px 14px;
    background: #1b6fb5; color: #fff; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Momo running; tap, click or press Space to jump"></canvas>
<div class="hud">
  <span>Tap, click or press <b>Space</b> to jump</span>
  <span><code id="readout">RUN</code></span>
  <button id="slow" type="button">Slow motion: off</button>
</div>

<script>
/* ======================================================================
   SETTINGS — engine.js CFG and the 'mammoth' character, unchanged
   ====================================================================== */
var CFG = {
  W: 1920, H: 1080,
  surfaceY: 840,          // the snow line
  mammothX: 430,          // Momo's mark on screen
  runSpeed: 520,          // px/s the world scrolls at
  gravity: 2612,          // px/s²
  jumpVel: -1371,         // px/s up: 360px apex, 1.05s airtime
  coyoteMs: 200,          // (engine.js keeps it; see canJump)
  bufferMs: 250,          // a tap this early still fires on touchdown
  jumpLead: 300,          // px forward during the leap
  jumpLeadBackS: 0.9,     // the shortest ease back to the mark
  leadBackMax: 0.6,       // the ease back never exceeds this share of the run speed
  sprite: { cw: 420, ch: 320, cols: 6, baseGap: 27 },  // cell size, columns, gap under the foot line
  scale: 1.75,            // Momo's draw scale
  stride: 1120,           // px of ground one run cycle covers (the legs follow distance, not time)
  frames: { run: 36, jump: 24 },
  sheets: {
    // paths from this page; in another game point these at your copies
    run:  '../game/assets/char/mammoth-run.webp',
    jump: '../game/assets/char/mammoth-jump-v2.webp'
  }
};
var CELL_K = 1;   // 1.5 with the hd/ sheets (630 x 480 cells): the scale divides by it, same size on screen

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }

/* ======================================================================
   DUST — Particles.poof, the puff kind only
   ====================================================================== */
function Dust() { this.list = []; }
Dust.prototype.poof = function (x, y, n, size) {
  n = n || 5; size = size || 1;
  for (var i = 0; i < n; i++) {
    var a = -Math.PI / 2 + (i / Math.max(1, n - 1) - 0.5) * 2.4 + rand(-0.25, 0.25);
    var v = rand(70, 160) * size;
    this.list.push({ x: x + rand(-16, 16) * size, y: y + rand(-6, 2),
      vx: Math.cos(a) * v * 1.5, vy: Math.sin(a) * v * 0.5 - 24,
      r: rand(10, 19) * size, dur: rand(0.5, 0.9), t: 0, swell: rand(1.5, 2.2) });
  }
};
Dust.prototype.update = function (dt) {
  for (var i = this.list.length - 1; i >= 0; i--) {
    var p = this.list[i];
    p.t += dt; p.x += p.vx * dt - CFG.runSpeed * dt * 0.6; p.y += p.vy * dt;
    p.vx *= 1 - 2.2 * dt; p.vy *= 1 - 2.2 * dt;
    if (p.t >= p.dur) this.list.splice(i, 1);
  }
};
Dust.prototype.draw = function (ctx) {
  for (var i = 0; i < this.list.length; i++) {
    var p = this.list[i], k = p.t / p.dur;
    ctx.globalAlpha = 0.55 * (1 - k);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * lerp(1, p.swell, k), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
};

/* ======================================================================
   MOMO — PlayerController's run and jump, on their own
   ====================================================================== */
function Momo(sheets, dust) {
  this.run = sheets.run; this.jumpSheet = sheets.jump; this.dust = dust;
  this.state = 'RUN'; this.t = 0;
  this.y = 0; this.vy = 0; this.airborne = false; this.lastGround = 0; this.bufferedJump = -1;
  this.dx = 0; this.dxFrom = 0; this.dxT = 0; this.jumpStartDx = 0;
  this.runDist = 0; this.squash = 1; this.airSq = 1; this.tilt = 0;
  this.frame = 0;
}
Momo.prototype.setState = function (s) { this.state = s; this.t = 0; };

/* the arc's progress, read off the vertical speed: 0 at take-off, 1 at touchdown, linear in time */
Momo.prototype.u = function () { return clamp((this.vy - CFG.jumpVel) / Math.max(1, -2 * CFG.jumpVel), 0, 1); };

Momo.prototype.canJump = function (now) { return !this.airborne || (now - this.lastGround) < CFG.coyoteMs; };

/* a tap: jump now if on the ground, otherwise keep it for the landing (bufferMs) */
Momo.prototype.requestJump = function (now) {
  if (this.state !== 'RUN' && this.state !== 'JUMP_START' && this.state !== 'JUMP_AIR' && this.state !== 'LAND') return false;
  if (this.canJump(now) && !this.airborne) { this.doJump(); return true; }
  this.bufferedJump = now; return false;
};

Momo.prototype.doJump = function () {
  // a second jump during the ease back continues from where he is, not from his mark
  this.jumpStartDx = this.dx || 0;
  this.vy = CFG.jumpVel; this.airborne = true; this.setState('JUMP_START');
  this.squash = 1.13;   // STRETCH off the ground (the crouch is in the art)
  this.dust.poof(this.drawX() - 10, CFG.surfaceY, 4, 0.8);
};

Momo.prototype.update = function (dt, now) {
  this.t += dt;
  if (this.state === 'RUN') this.runDist += CFG.runSpeed * dt;   // the legs follow the ground

  if (this.airborne) {
    // integrate with the AVERAGE velocity: the apex and the landing do not depend on the frame rate
    var oldVy = this.vy;
    this.vy += CFG.gravity * dt;
    this.y += (oldVy + this.vy) * 0.5 * dt;
    // the arc travels forward, linear against a parabolic height
    var u = this.u();
    this.dx = this.jumpStartDx + (CFG.jumpLead - this.jumpStartDx) * u;
    if (this.state === 'JUMP_START' && this.t > 0.08) this.setState('JUMP_AIR');
    if (this.y >= 0) {
      // landed AHEAD; the frame eases back to him over the next stride
      this.dxFrom = this.dx; this.dxT = 0;
      this.y = 0; this.vy = 0; this.airborne = false; this.lastGround = now;
      this.setState('LAND'); this.squash = 0.82;   // weight arriving
      this.dust.poof(this.drawX(), CFG.surfaceY, 6, 1.15);
    }
  } else {
    // back to the mark: smootherstep, and never faster than leadBackMax of the run speed
    if (this.dx !== 0) {
      this.dxT += dt;
      var back = Math.abs(this.dxFrom);
      var capped = back > 0 ? (1.875 * back) / Math.max(1, CFG.runSpeed * CFG.leadBackMax) : 0;
      var dur = Math.max(CFG.jumpLeadBackS, capped);
      var p = clamp(this.dxT / Math.max(0.01, dur), 0, 1);
      var s = p * p * p * (p * (p * 6 - 15) + 10);
      this.dx = p >= 1 ? 0 : this.dxFrom * (1 - s);
    }
    if (this.bufferedJump > 0 && now - this.bufferedJump < CFG.bufferMs &&
        (this.state === 'RUN' || this.state === 'LAND')) { this.bufferedJump = -1; this.doJump(); }
    if (this.state === 'LAND' && this.t > 0.12) {
      // resume the stride on run cell 24 — the grounded silhouette nearest the last landing cell
      var cycle = Math.floor(this.runDist / CFG.stride);
      var target = 24 / CFG.frames.run;
      var phase = this.runDist / CFG.stride - cycle;
      this.runDist = (cycle + (phase > target ? 1 : 0) + target) * CFG.stride + 0.001;
      this.setState('RUN');
    }
  }

  // the discrete beats (1.13 off, 0.82 on) ease back quickly; the flight has its own stretch
  this.squash = lerp(this.squash, 1, clamp(dt * 12, 0, 1));
  if (this.airborne) {
    var uu = this.u(), spd = clamp(Math.abs(this.vy) / Math.abs(CFG.jumpVel), 0, 1);
    this.tilt = lerp(this.tilt, lerp(-0.16, 0.14, uu), clamp(dt * 16, 0, 1));   // nose up, then down
    this.airSq = lerp(this.airSq, 1 + 0.13 * spd * spd, clamp(dt * 18, 0, 1));  // stretched when fast
  } else {
    this.tilt = lerp(this.tilt, 0, clamp(dt * 9, 0, 1));
    this.airSq = lerp(this.airSq, 1, clamp(dt * 12, 0, 1));
  }
};

Momo.prototype.drawX = function () { return CFG.mammothX + (this.dx || 0); };

Momo.prototype.draw = function (ctx) {
  var sheet, f;
  switch (this.state) {
    case 'RUN':        sheet = this.run;       f = Math.floor((this.runDist / CFG.stride) * CFG.frames.run) % CFG.frames.run; break;
    case 'JUMP_START': sheet = this.jumpSheet; f = 12; break;                                   // push-off
    case 'JUMP_AIR':   sheet = this.jumpSheet; f = 12 + Math.min(8, Math.floor(this.u() * 9)); break;  // cells 12–20 with the arc
    case 'LAND':       sheet = this.jumpSheet; f = 21 + Math.min(2, Math.floor(this.t / 0.04)); break; // impact, compress, recover
  }
  this.frame = f;
  var x = this.drawX(), y = CFG.surfaceY + this.y;
  var COLS = CFG.sprite.cols, CW = CFG.sprite.cw * CELL_K, CH = CFG.sprite.ch * CELL_K, S = CFG.scale / CELL_K;

  // soft contact shadow, fading as he rises
  var shA = clamp(1 + this.y / 260, 0.15, 1);
  ctx.save();
  ctx.translate(x + 4, CFG.surfaceY + 2); ctx.scale(1, 0.22);
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, 170);
  g.addColorStop(0, 'rgba(20,50,80,' + (0.32 * shA).toFixed(3) + ')'); g.addColorStop(1, 'rgba(20,50,80,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 170, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // everything about the FOOT LINE: a squash keeps the feet down, a stretch grows upward,
  // and X takes the inverse square root so the volume is kept
  var sq = this.squash * this.airSq;
  var sqX = 1 / Math.sqrt(Math.max(0.35, sq));
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(this.tilt);
  ctx.scale(sqX, sq);
  if (sheet && sheet.complete && sheet.naturalWidth) {
    ctx.drawImage(sheet, (f % COLS) * CW, Math.floor(f / COLS) * CH, CW, CH,
                  -CW * S / 2, -CH * S + CFG.sprite.baseGap * CELL_K * S, CW * S, CH * S);
  }
  ctx.restore();
};

/* ======================================================================
   DEMO — a scrolling snowfield, input, and the loop
   ====================================================================== */
var canvas = document.getElementById('scene'), ctx = canvas.getContext('2d');
var readout = document.getElementById('readout'), slowBtn = document.getElementById('slow');
function img(src) { var i = new Image(); i.src = src; return i; }
var dust = new Dust();
var momo = new Momo({ run: img(CFG.sheets.run), jump: img(CFG.sheets.jump) }, dust);
var world = 0, slow = false, fit = { k: 1, ox: 0, oy: 0 };

function resize() {
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
  var k = Math.min(canvas.width / CFG.W, canvas.height / CFG.H);
  fit = { k: k, ox: (canvas.width - CFG.W * k) / 2, oy: (canvas.height - CFG.H * k) / 2 };
}
addEventListener('resize', resize); resize();

function tap(e) { if (e) e.preventDefault(); momo.requestJump(performance.now()); }
canvas.addEventListener('pointerdown', tap);
addEventListener('keydown', function (e) { if (e.code === 'Space' || e.code === 'ArrowUp') tap(e); });
slowBtn.addEventListener('click', function (e) { e.stopPropagation(); slow = !slow; slowBtn.textContent = 'Slow motion: ' + (slow ? 'on' : 'off'); });

function drawWorld() {
  var sky = ctx.createLinearGradient(0, 0, 0, CFG.surfaceY);
  sky.addColorStop(0, '#bfe6ff'); sky.addColorStop(1, '#eaf7ff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, CFG.W, CFG.surfaceY);
  ctx.fillStyle = '#f4fbff'; ctx.fillRect(0, CFG.surfaceY, CFG.W, CFG.H - CFG.surfaceY);
  ctx.fillStyle = '#d7ecf9'; ctx.fillRect(0, CFG.surfaceY, CFG.W, 6);
  // marks in the snow, scrolling at the run speed, so the legs can be seen to match the ground
  ctx.fillStyle = '#cfe4f3';
  var gap = 240, off = world % gap;
  for (var x = -off; x < CFG.W + gap; x += gap) {
    ctx.beginPath(); ctx.ellipse(x, CFG.surfaceY + 60, 46, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 120, CFG.surfaceY + 150, 70, 10, 0, 0, Math.PI * 2); ctx.fill();
  }
}

var last = performance.now();
function frame(now) {
  // sub-step a long frame at 30Hz instead of dropping the time (engine.js does the same)
  var dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (slow) dt *= 0.25;
  while (dt > 0) { var step = Math.min(dt, 1 / 30); world += CFG.runSpeed * step; momo.update(step, now); dust.update(step); dt -= step; }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = getComputedStyle(document.body).backgroundColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(fit.k, 0, 0, fit.k, fit.ox, fit.oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, CFG.W, CFG.H); ctx.clip();
  drawWorld(); dust.draw(ctx); momo.draw(ctx);
  ctx.restore();
  readout.textContent = momo.state + ' · cell ' + momo.frame + (momo.airborne ? ' · u ' + momo.u().toFixed(2) + ' · height ' + Math.round(-momo.y) + 'px' : '');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
