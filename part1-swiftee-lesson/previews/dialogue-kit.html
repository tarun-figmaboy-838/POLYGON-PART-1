<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialogue Kit</title>
<!--
  DIALOGUE KIT — the speech bubble and the story narration box of POLYGON Part 1
  (part1-swiftee-lesson), lifted out of the game as one self-contained page.

  Open this file in a browser: "Say a line" plays the bubble over the placeholder speaker,
  "Narrate" plays the story box (pick the speaker beside it). Copy from it into another story
  project: the <style> and <script> blocks depend on none of the game's modules (Swiftee,
  Stage, Director, VO, DualCode, SFX, Story). Plain ES5, no build.

  WHAT IS HERE, AND WHERE IT CAME FROM
  ------------------------------------
  1. THE SPEECH BUBBLE ("dialogue box")
     CSS  index.html   :root tokens (--ink, --sans, --instruction-text, --instruction-accent);
                       #bubble — the paper, the comic ink rim and its offset/glow shadows, the
                       pop-in (bubbleIn), the states .pre / .pre-swap / .show / .enter / .out /
                       .dim / .passive / .away / .back (bubbleBack); .bubble-tail and
                       #bubble[data-tail=*] — the tail SVG that is one silhouette with the box,
                       turned to whichever edge faces the speaker; .dialogue-inner (Fredoka);
                       .bubble-line .w — each word's arrival; .dc-term / .dc-ink / .dc-keep and
                       dcTermPop — the emphasised key word; the reduced-motion rules.
     JS   src/game/game.js         say() + putLine()      -> Bubble.say  (entrance; the swap between two
                                                             bubbles of one line: .out 170ms, then .pre-swap)
                                   unitsOf() reveal() revealAll() showUnit()
                                                          -> the word-by-word reveal, stepped on the frame
                                   lineRows() snugWidth() rowsOfLine()
                                                          -> the box closes to its widest row
                                   paintSkin() + TIP / MOUTH_LO / MOUTH_HI / TAIL_SIZE
                                                          -> Bubble.aimAt  (the tail aimed at the speaker)
                                   headPoint()            -> the head is the top 18% of the speaker's box
                                   tapLine()              -> Bubble.tap (a tap finishes the sentence)
                                   speakLine()            -> Bubble.speak (a line in parts, on Timing.schedule)
          src/game/dual-coding.js  FORMS / markup()       -> Bubble.markup (the key-word markup)
          src/game/dialogue-timing.js                     -> Timing, carried over whole (WORD_MS 280, the
                                                             breaths, readingPause, interactionDelay,
                                                             PANEL_LEAD/SWAP_OUT/SWAP_IN/SWAP_LEAD, schedule)
     SIMPLIFIED: placeBubble()'s search for a free slot round the lesson is replaced by
     anchor(): the bubble sits above the speaker point with the tail's tip on it (below it
     when there is no room above). paintSkin is unchanged, so the tail still aims exactly.

  2. THE STORY NARRATION BOX (the Momo and Popo story)
     CSS  index.html   #story .story-say (+ [data-who="narrator" | "momo" | "popo"]),
                       storyBoing / storyAgain / storyDrop, .story-say-shape (the one-outline
                       bubble-and-tail for a character), .story-say .w and .w.k .kw (each
                       word's pop; the focus word's orange), the reduced-motion rules.
     JS   src/story/story.js      T (the clock)          -> Narration.T
                                  MOTION (the comic beats: hop bob twostep lift wave swing recoil
                                    perk doubletake nod proud gulp lean eager)
                                                         -> Narration.MOTION, Narration.beat(el, kind)
                                  later() sleep() animate() cleanupStoryScene() -> the one clean-up
                                  partsOf() bubblePath() layoutSay() place() showSay() hideSay()
                                                         -> the layout of one part of a line
                                  cuesFor() (no voice: Timing.cues), reveal() (the parts taking the
                                    box in turn: partLead 240 / partMin 420 / partOut 130)
                                  speak()                -> Narration.show  (sayOut 170 + between 240 ->
                                                            layout -> 'pop' -> sayLead 90 -> reveal)
                                  showScene()'s tail, next()
                                                         -> Narration.sequence (readingPause between lines;
                                                            lastHold 700 -> autoNext 500 -> hide, sayOut 170)
                                  cue() move()           -> Narration.cue / Narration.beat
          src/story/story-data.js  the shape of a line { who, text, parts, key, box, tip, start, at }
                                   and the sample lines the demo plays (scene 1).
     LEFT OUT: the paintings, their regions/masks, sheens, glints, snow, camera, and the voice
     (VO). A MOTION beat here runs on any element you name, where the game flexes a masked
     region of the painting; the numbers are the same.

  3. EFFECTS: sfx(name, level) is a stub. Hook points kept: the story's 'pop' (level 0.28) as a
     character's bubble comes up (story.js speak), a cue's sfx / sfx2 on a word (story.js cue).
     The lesson's own bubble plays no sound of its own in say().

  COORDINATES: Bubble works in the host's pixels (aimAt(x, y) is host-local). Narration works,
  as the story does, in PAINTING pixels — a 1672 x 941 board scaled onto the host by --story-k
  (game.js seatFurniture) — so a box or a tip is placed once and lands on the same spot on every
  screen. The demo converts the speaker's position with toPainting().
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ======================================================================
     0. TOKENS  (index.html :root)
     ====================================================================== */
  :root {
    --ink: #1c2a4a;
    --sans: "Nunito", "Segoe UI", system-ui, sans-serif;
    /* Comic ink: one outline weight and one hard offset shadow, reused by the
       bubble, the card and every button, so they read as one drawn set. */
    --ink-w: 3px;
    /* the ink of an instruction and the accent its key words are set in */
    --instruction-text: #174D59;
    --instruction-accent: #ff7a0e;
  }

  /* ======================================================================
     1. THE SPEECH BUBBLE  (index.html, "THE SPEECH BUBBLE")
     A bordered box of paper with a tail that is ONE SILHOUETTE with it.

     The tail is a 60x60 SVG on a "0 0 60 60" viewBox. y=12 in that box is
     the MOUTH, placed on the centreline of the bubble's border. The fill
     starts at y=0, twelve units before the mouth, so it covers the border
     across the mouth's width. Only the two FREE edges are stroked. The same
     square serves all four sides by rotating about its centre; paintSkin()
     picks the side that faces the speaker, slides the tail along it to the
     head, and mirrors the sweep so the tip leans the speaker's way.
     --svw is a hundredth of the stage's width (game.js seatFurniture);
     Bubble.mount sets it on the host.
     ====================================================================== */
  #bubble {
    --bubble-edge:   #169F99;   /* the border; the tail's outline follows it */
    --bubble-paper:  #FFFBEA;   /* the fill; the tail's fill follows it      */
    --bubble-ink:    var(--instruction-text, #174D59);
    --bubble-border: 4px;       /* keep in step with --tail-offset            */
    --bubble-radius: 26px;
    /* the 60-unit tail drawing, shown at this size (game.js TAIL_SIZE, TIP, MOUTH_* work in the same pixels) */
    --tail-size:     36px;
    --tail-offset:   5.2px;     /* mouth(12/60 of the size) - border/2        */
    --tail-x:        calc(70% - 18px);
    --tail-y:        calc(50% - 18px);

    position: absolute; z-index: 4;
    isolation: isolate;
    box-sizing: border-box;
    /* ONE SIZE FOR EVERY LINE: it scales with the stage and with nothing else */
    font-size: clamp(18px, calc(2 * var(--svw, 1vw)), 40px);
    max-width: min(820px, calc(68 * var(--svw, 1vw)));
    min-width: 5em;
    padding: .5em .78em;
    display: flex; align-items: center; justify-content: center;
    border: var(--bubble-border) solid var(--bubble-edge);
    border-radius: var(--bubble-radius);
    background: var(--bubble-paper);
    color: var(--bubble-ink);
    box-shadow:
      inset 0 2px 0 #FFFFFF,
      0 0 14px 2px rgb(22 159 153 / .16),
      0 0 30px 8px rgb(22 159 153 / .07),
      0 8px 20px rgb(12 64 78 / .16);
    opacity: 0; pointer-events: none;
    /* THE PANEL ARRIVES WITH A SOFT POP: 94% to 102% and settle, in 220ms
       (bubbleIn) — and the first word lands 120ms into that (Timing.PANEL_LEAD). */
    transform: translateY(6px) scale(.94);
    transform-origin: 12% 100%;
    /* IT GLIDES, IT DOES NOT JUMP: a re-placement after the line is up eases
       over 240ms. .snap turns the glide off for the FIRST placement of a line. */
    transition: transform 220ms cubic-bezier(.22, 1, .36, 1), opacity 200ms ease-out,
                left 240ms cubic-bezier(.3, .8, .3, 1), top 240ms cubic-bezier(.3, .8, .3, 1);
  }
  #bubble.snap { transition: transform 220ms cubic-bezier(.22, 1, .36, 1), opacity 200ms ease-out; }
  /* THE START OF AN ENTRANCE, laid down with no transition: from below for a
     line arriving, from just below for the next bubble of one. */
  #bubble.pre      { transition: none !important; opacity: 0; transform: translateY(6px) scale(.94); }
  #bubble.pre-swap { transition: none !important; opacity: 0; transform: translateY(5px) scale(.96); }
  /* The pop itself. Fill 'backwards' only: once it has played the bubble is
     back on its ordinary styles, so dimming it still works. */
  #bubble.show.enter { animation: bubbleIn 220ms ease-out backwards; }
  @keyframes bubbleIn {
    0%   { opacity: 0; transform: translateY(6px) scale(.94); }
    60%  { opacity: 1; transform: translateY(0) scale(1.02); }
    100% { opacity: 1; transform: none; }
  }
  /* the small catch-light that keeps the paper playful */
  #bubble::before {
    content: '';
    position: absolute; left: 14px; top: 10px;
    width: .8em; height: .28em; border-radius: 999px;
    background: #fff; transform: rotate(-22deg); pointer-events: none;
  }
  #bubble.show { opacity: 1; pointer-events: auto; cursor: pointer; transform: none; }
  /* WHILE THE SPEAKER IS AWAY the words step aside, and spring back when home */
  #bubble.show.away, #bubble.show.dim.away { opacity: 0; transform: scale(.94); transition: opacity 200ms ease, transform 200ms ease; }
  #bubble.show.back { animation: bubbleBack 460ms cubic-bezier(.3,1.5,.5,1); }
  @keyframes bubbleBack { 0% { opacity: 0; transform: scale(.9); } 60% { opacity: 1; transform: scale(1.03); } 100% { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #bubble.show.back { animation: none; } #bubble.show.away { transition: none; } }
  /* KEPT UP, BUT OUT OF THE WAY: an instruction stays while it is obeyed and takes no taps */
  #bubble.show.passive { pointer-events: none; cursor: default; }
  /* WHILE THE CHILD WORKS, THE WORDS STEP BACK A LITTLE */
  #bubble.show.dim { opacity: .82; }
  /* GOING AWAY IS QUICKER THAN ARRIVING: lifts four pixels and fades in 170ms,
     and only then does the next bubble come in. */
  #bubble.out { opacity: 0; transform: translateY(-4px); transition: transform 170ms ease-in, opacity 170ms ease-in; }

  .dialogue-inner {
    position: relative; z-index: 2; max-width: 100%;
    color: var(--bubble-ink);
    font-family: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", var(--sans);
    font-size: inherit; font-weight: 700; line-height: 1.3;
    letter-spacing: .2px; text-align: center;
    /* BALANCED, SO NO WORD IS LEFT ON ITS OWN; the box then closes to the widest row (snugWidth) */
    text-wrap: balance;
  }
  .bubble-line { display: block; }

  /* ---- the tail ---- */
  .bubble-tail {
    position: absolute;
    width: var(--tail-size); height: var(--tail-size);   /* square: required, so it rotates about its centre */
    overflow: visible; pointer-events: none;
    transform-origin: center;
    z-index: 1;                  /* above the bubble's own border, so the fill hides it */
    left: var(--tail-x); top: calc(100% - var(--tail-offset));
  }
  .bubble-tail-fill   { fill: var(--bubble-paper); }
  .bubble-tail-stroke {
    fill: none; stroke: var(--bubble-edge);
    /* the 60-unit drawing is shown at --tail-size, so 4px of border is 4 x 60/36 units of stroke */
    stroke-width: 6.67;
    stroke-linecap: round; stroke-linejoin: round;
  }
  #bubble[data-tail="bottom"] > .bubble-tail { left: var(--tail-x); top: calc(100% - var(--tail-offset)); transform: none; }
  #bubble[data-tail="top"]    > .bubble-tail { left: var(--tail-x); top: calc(var(--tail-offset) - var(--tail-size)); transform: rotate(180deg); }
  #bubble[data-tail="right"]  > .bubble-tail { left: calc(100% - var(--tail-offset)); top: var(--tail-y); transform: rotate(-90deg); }
  #bubble[data-tail="left"]   > .bubble-tail { left: calc(var(--tail-offset) - var(--tail-size)); top: var(--tail-y); transform: rotate(90deg); }
  #bubble:not([data-tail]) > .bubble-tail { display: none; }
  /* Mirror the tail's sweep without moving it. */
  #bubble[data-tail-flip] > .bubble-tail > g { transform: scale(-1,1); transform-origin: 30px 30px; }

  @media (max-width: 900px) { #bubble { font-size: clamp(16px, 2.4vw, 24px); } }
  @media (max-width: 600px) { #bubble { font-size: clamp(15px, 4.2vw, 21px); } }

  @media (prefers-reduced-motion: reduce) {
    #bubble, #bubble.pre, #bubble.pre-swap, #bubble.out { transform: none; }
    #bubble { transition: opacity 200ms ease; }
    #bubble.out { transition: opacity 160ms ease; }
    #bubble.show.enter { animation: none; }
  }

  /* ---- the line arrives a word at a time ----
     Each word is its own span, hidden with opacity (never display) so the
     bubble is laid out at its FINAL size from the first frame. Each word
     arrives up four pixels, from 96%, fading in — about 160ms — one after
     another at a read-aloud pace (~280ms apart, Timing). scale and translate,
     never transform, so nothing here can throw away a position something
     else set. No blur. */
  .bubble-line .w, .bubble-line .dc-term {
    display: inline-block;
    transform-origin: 50% 80%;
    transition: opacity 160ms cubic-bezier(.25,.8,.35,1),
                scale 170ms cubic-bezier(.25,.8,.35,1),
                translate 170ms cubic-bezier(.25,.8,.35,1);
  }
  .bubble-line.revealing .w, .bubble-line.revealing .dc-term { opacity: 0; scale: .96; translate: 0 4px; }
  .bubble-line .w.in, .bubble-line .dc-term.in { opacity: 1; scale: 1; translate: 0 0; }
  @media (prefers-reduced-motion: reduce) {
    .bubble-line .w, .bubble-line .dc-term { transition: opacity 120ms ease-out; scale: 1; translate: 0 0; }
    .bubble-line.revealing .w:not(.in), .bubble-line.revealing .dc-term:not(.in) { translate: 0 0; scale: 1; }
  }

  /* ---- the key word: THE LOUDEST WORD IN THE BUBBLE ----
     One flat warm orange, a touch bigger than the sentence. The bump in size
     is paid back in line-height (1.07 x 1.215 = 1.3, the line's own), so a row
     with a term in it is the same height as a row without one, and the term
     hangs from the TOP of the row so row-counting stays right. */
  .dc-term {
    position: relative; isolation: isolate;
    display: inline-block; vertical-align: top;
    padding: 0; margin: 0;
    font-size: 1.07em; line-height: 1.215;
    font-weight: 800; white-space: nowrap;
  }
  .dc-ink {
    display: inline-block;
    color: var(--instruction-accent, #B84A00);
    text-shadow: 0 1px 0 rgba(120, 40, 0, .16);
  }
  /* ...and when it lands, a tiny pop more than the words round it */
  .bubble-line.revealing .dc-term.in { animation: dcTermPop 220ms cubic-bezier(.22, 1, .36, 1) both; }
  @keyframes dcTermPop {
    0%   { scale: .92; }
    60%  { scale: 1.06; }
    100% { scale: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .bubble-line.revealing .dc-term.in { animation: none; } }
  /* a term and the punctuation that follows it, held together */
  .dc-keep { white-space: nowrap; }

  /* ======================================================================
     2. THE STORY NARRATION BOX  (index.html, "THE STORY", the .story-say rules)
     The story is drawn at 1672 x 941 and scaled whole onto the 16:9 board
     (--story-k, --band-x, --band-y), so everything placed on it lands on the
     same spot on every screen. The narrator is a storybook label — cream
     paper and one brown line — that drops in with a bounce; Momo and Popo
     speak in white bubbles that pop out of the tail with a boing (the bubble
     and its tail are one drawn outline, bubblePath). A long line is shown in
     short parts one after another; its focus words arrive in warm orange.
     ====================================================================== */
  /* KIT NOTE: the game's #story also has `background: #7cc8f6` (the paintings' sky), because
     it covered the whole lesson. Left off here — and pointer-events off — so the layer can sit
     over any scene; the demo stage carries the sky colour instead. */
  #story { position: absolute; inset: 0; z-index: 5; overflow: hidden; pointer-events: none; }
  #story[hidden] { display: none; }
  #story .story-frame {
    position: absolute; left: var(--band-x, 0px); top: var(--band-y, 0px);
    width: 1672px; height: 941px; overflow: hidden;
    transform-origin: 0 0; transform: scale(var(--story-k, 1));
  }
  #story .story-ui { pointer-events: none; }

  #story .story-say {
    position: absolute; left: 0; top: 0; z-index: 2; width: max-content; box-sizing: border-box;
    isolation: isolate; opacity: 0; pointer-events: none;
    rotate: var(--tilt, 0deg); transform: scale(.9); transform-origin: var(--ox, 50%) var(--oy, 100%);
    transition: opacity 160ms ease-out, transform 200ms ease-out;
  }
  #story .story-say.show { opacity: 1; transform: none; }
  #story .story-say.out { opacity: 0; transform: scale(.92); transition: opacity 150ms ease-in, transform 150ms ease-in; }
  #story .story-say.enter { animation: storyBoing 540ms cubic-bezier(.3, 1.3, .5, 1) backwards; }
  /* a line's next part: the same speaker going on, so a small pop, not a new entrance */
  #story .story-say.enter.again, #story .story-say[data-who="narrator"].enter.again { animation: storyAgain 260ms cubic-bezier(.3, 1.4, .5, 1) backwards; }
  @keyframes storyAgain {
    0%   { opacity: 0; transform: scale(.9); }
    60%  { opacity: 1; transform: scale(1.03); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes storyBoing {
    0%   { opacity: 0; transform: scale(.35) rotate(-7deg); }
    45%  { opacity: 1; transform: scale(1.09) rotate(2.5deg); }
    70%  { transform: scale(.96) rotate(-1.2deg); }
    86%  { transform: scale(1.02) rotate(.4deg); }
    100% { opacity: 1; transform: none; }
  }
  /* the narrator's panel stands straight ("do not tilt the narration box") */
  #story .story-say[data-who="narrator"] {
    --tilt: 0deg;
    padding: 20px 42px 22px;
    background: #fff3d1; border: 5px solid #6b4423; border-radius: 26px;
    box-shadow: 6px 8px 0 rgba(107, 68, 35, .92), 0 16px 30px rgba(20, 50, 90, .22);
    /* never under 16px on the screen, however small the board (--story-k is its scale) */
    font-family: var(--sans); font-weight: 800; font-size: max(33px, calc(16px / var(--story-k, 1))); line-height: 1.42;
    color: #5a3517; text-align: center;
  }
  #story .story-say[data-who="narrator"].enter { animation: storyDrop 600ms cubic-bezier(.3, 1.25, .5, 1) backwards; }
  @keyframes storyDrop {
    0%   { opacity: 0; transform: translateY(-34px) scale(.94); }
    55%  { opacity: 1; transform: translateY(5px) scale(1.02); }
    80%  { transform: translateY(-2px); }
    100% { opacity: 1; transform: none; }
  }
  /* the characters' bubbles */
  #story .story-say[data-who="momo"], #story .story-say[data-who="popo"] {
    padding: 24px 36px 22px;
    font-family: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", var(--sans);
    font-weight: 600; font-size: max(37px, calc(17px / var(--story-k, 1))); line-height: 1.26; letter-spacing: .3px;
    color: var(--ink); text-align: center;
  }
  #story .story-say[data-who="momo"] { --tilt: -1.2deg; }
  #story .story-say[data-who="popo"] { --tilt: 1.2deg; }
  #story .story-say-shape { position: absolute; left: 0; top: 0; z-index: -1; overflow: visible; pointer-events: none; }
  #story .story-say[data-who="narrator"] .story-say-shape { display: none; }
  #story .story-say-shape .fill { fill: #fff; stroke: var(--ink); stroke-width: 5.5; stroke-linejoin: round; }
  #story .story-say-shape .shade { fill: var(--ink); opacity: .88; }
  /* one line, always (place() fits the type to the room instead of wrapping) */
  #story .story-say-text { position: relative; display: block; white-space: nowrap; }
  /* each word pops in as it is said: from a little small and low, just past its size, home */
  #story .story-say .w {
    display: inline-block; transform-origin: 50% 85%;
    transition: opacity 140ms ease-out, scale 280ms cubic-bezier(.3, 1.8, .55, 1), translate 280ms cubic-bezier(.3, 1.8, .55, 1);
  }
  #story .story-say.revealing .w { opacity: 0; scale: .62; translate: 0 7px; }
  #story .story-say.revealing .w.in { opacity: 1; scale: 1; translate: 0 0; }
  /* THE FOCUS WORDS (`key`): the lesson's key-word orange, a touch deeper so it holds on white
     and on cream, and a bigger pop as it lands — the same size as its neighbours */
  #story .story-say .w.k .kw { color: #e65c00; }
  #story .story-say.revealing .w.k:not(.in) { scale: .55; }
  @media (prefers-reduced-motion: reduce) {
    #story .story-say, #story .story-say.out { transform: none; }
    #story .story-say.enter, #story .story-say[data-who="narrator"].enter { animation: none; }
    #story .story-say .w { transition: opacity 120ms ease-out; }
    #story .story-say.revealing .w { scale: 1; translate: 0 0; }
  }

  /* ======================================================================
     3. THE DEMO PAGE  (kit only — not from the game)
     ====================================================================== */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #a9d6f4; font-family: var(--sans); color: var(--ink); }
  body { padding: 20px 16px 40px; user-select: none; -webkit-user-select: none; }
  .demo { max-width: 960px; margin: 0 auto; }
  .demo h1 { font: 700 22px/1.2 "Fredoka", var(--sans); color: #174D59; margin: 0 0 4px; }
  .demo p.lede { margin: 0 0 14px; font-size: 14px; color: #2c4a63; }
  .demo p.lede code { font-size: 12px; background: rgba(255,255,255,.55); padding: 1px 5px; border-radius: 6px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .bar button, .bar select {
    font: 700 16px/1 "Fredoka", var(--sans); color: #fff; background: #169F99;
    border: 3px solid #174D59; border-radius: 14px; padding: 10px 18px; cursor: pointer;
    box-shadow: 3px 4px 0 #174D59;
  }
  .bar button:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 #174D59; }
  .bar select { background: #FFFBEA; color: #174D59; padding: 9px 12px; }
  .bar .hint { font-size: 13px; color: #2c4a63; }
  /* the stage: the sky colours of the story (#7cc8f6) and the lesson's band (#acd8fd) */
  #stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 18px;
    background: linear-gradient(#7cc8f6 0%, #7cc8f6 62%, #acd8fd 100%);
    border: 3px solid #174D59; box-shadow: 4px 6px 0 rgba(23, 77, 89, .85);
  }
  /* the placeholder speaker (stands in for Swiftee / Momo / Popo): its head is the top 18% (headPoint) */
  #speaker {
    position: absolute; z-index: 3; left: 12%; bottom: 10%; width: 96px; height: 96px; border-radius: 50%;
    background: #fff; border: 4px solid #174D59; box-shadow: 4px 5px 0 rgba(23, 77, 89, .9);

    /** The words of the line, each arriving on its cue, and the line's parts taking the box in
        turn: the next comes up just before its first word, and never before the one showing
        has been all there for a moment. */
    function reveal(line, L, cues) {
      return new Promise(function (resolve) {
        var g = gen, i = 0, n = L.words.length, p = 0, doneAt = null, swapUntil = 0;
        var P = pace(), lead = T.partLead * P, least = T.partMin * P, out = T.partOut * P;
        var hooks = (line.at || []).map(function (h) { return { i: wordIndex(line.text, h.word), c: h }; });
        var t0 = now();
        var rq = global.requestAnimationFrame || function (f) { return setTimeout(function () { f(now()); }, 16); };
        var tick = function () {
          raf = 0;
          if (g !== gen) return;
          var t = now() - t0;
          if (swapUntil) {
            // the part before has gone: the next one comes up in its place
            if (now() < swapUntil) { raf = rq(tick); return; }
            swapUntil = 0; p++; doneAt = null;
            layoutSay(line, L.words, L.parts[p]);
            showSay(true);
          }
          var part = L.parts[p];
          while (i < part.to && cues[i] <= t) {
            sayWords[i - part.from].classList.add('in');
            for (var h = 0; h < hooks.length; h++) if (hooks[h].i === i) cue(hooks[h].c);
            if (line.onWord) { try { line.onWord(i, L.words[i]); } catch (e) {} }
            i++;
          }
          if (i >= n) { resolve(true); return; }
          if (i >= part.to && p + 1 < L.parts.length) {
            if (doneAt == null) doneAt = t;
            if (t >= Math.max(cues[L.parts[p + 1].from] - lead, doneAt + least)) { hideSay(); swapUntil = now() + out; }
          }
          raf = rq(tick);
        };
        raf = rq(tick);
      });
    }

    /* ---- one line (story.js speak, less the voice) ---- */
    function show(text, o) {
      o = o || {};
      var line = {
        who: o.who || 'narrator', text: String(text), parts: o.parts || null, key: o.key || [],
        box: o.box || null, tip: o.tip || null, start: o.start || [], at: o.at || [], cues: o.cues || null, onWord: o.onWord || null
      };
      // story-data.js gives every line its own box; these stand in when none is given
      if (!line.box) {
        line.box = line.who === 'narrator' ? { cx: W / 2, top: 34 }
                 : (line.tip ? { cx: line.tip[0], bottom: line.tip[1] - 40 } : { cx: W / 2, bottom: H / 2 });
      }
      cleanup();
      var g = gen;
      var wait = hideSay() ? sleep(T.sayOut + T.between) : Promise.resolve();
      return wait.then(function () {
        if (g !== gen) return false;
        var L = partsOf(line);
        layoutSay(line, L.words, L.parts[0]);
        showSay();
        sayLine = line;
        if (line.who !== 'narrator') sfx('pop', 0.28);
        return sleep(T.sayLead).then(function () {
          if (g !== gen) return false;
          line.start.forEach(cue);
          return reveal(line, L, cuesFor(line, L.words.length));
        });
      });
    }
    /* ---- the lines of a scene (story.js showScene's tail, next) ----
       Between two lines: the reading pause of the one just said (voHold 480 when voiced).
       After the last: lastHold, then — by itself, autoNext later — the box goes (sayOut). */
    function sequence(lines) {
      var g, p = Promise.resolve(true);
      (lines || []).forEach(function (ln, i) {
        p = p.then(function (ok) {
          if (ok === false) return false;
          return show(ln.text, ln).then(function (ok2) {
            if (ok2 === false) return false;
            g = gen;
            if (i < lines.length - 1) return sleep(Timing.readingPause(ln.text, 1)).then(function () { return g === gen; });
            return true;
          });
        });
      });
      return p.then(function (ok) {
        if (ok === false) return false;
        g = gen;
        return sleep(T.lastHold).then(function () { return sleep(T.autoNext); }).then(function () {
          if (g !== gen) return false;
          hideSay();
          return sleep(T.sayOut).then(function () { return g === gen; });
        });
      });
    }
    /* called off from outside (story.js stop → end): every timer and animation goes, and the
       box leaves the way it always does (.out, sayOut) rather than vanishing */
    function stop() {
      cleanup();
      var was = hideSay();
      sayLine = null;
      return was;
    }

    /* ---- the board (game.js seatFurniture): the 16:9 board fitted in the host, the painting scaled onto it ---- */
    function fit() {
      var w = host.clientWidth, h = host.clientHeight;
      var s = Math.min(w / 1000, h / 562);
      var sw = 1000 * s;
      layer.style.setProperty('--band-x', Math.max(0, Math.round((w - sw) / 2)) + 'px');
      layer.style.setProperty('--band-y', Math.max(0, Math.round((h - 562 * s) / 2)) + 'px');
      layer.style.setProperty('--story-k', (sw / 1672).toFixed(5));
      if (sayLine && sayEl.classList.contains('show')) place(sayLine);
    }
    /** a host pixel to a painting pixel (for a tip or a box read off the live scene) */
    function toPainting(x, y) {
      var k = parseFloat(layer.style.getPropertyValue('--story-k')) || 1;
      var bx = parseFloat(layer.style.getPropertyValue('--band-x')) || 0, by = parseFloat(layer.style.getPropertyValue('--band-y')) || 0;
      return [Math.round((x - bx) / k), Math.round((y - by) / k)];
    }

    function mount(opts) {
      opts = opts || {};
      host = opts.host || doc.body;
      defaultTarget = opts.target || null;
      try { reduce = !!(global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { reduce = false; }
      layer = el('div', null, host); layer.id = 'story';
      ui = el('div', 'story-frame story-ui', layer);
      sayEl = el('div', 'story-say', ui);
      sayEl.setAttribute('role', 'status'); sayEl.setAttribute('aria-live', 'polite');
      sayShape = doc.createElementNS(NS, 'svg');
      sayShape.setAttribute('class', 'story-say-shape'); sayShape.setAttribute('aria-hidden', 'true');
      var shade = doc.createElementNS(NS, 'path'); shade.setAttribute('class', 'shade'); shade.setAttribute('transform', 'translate(0 6)');
      var fill = doc.createElementNS(NS, 'path'); fill.setAttribute('class', 'fill');
      sayShape.appendChild(shade); sayShape.appendChild(fill);
      sayEl.appendChild(sayShape);
      sayText = el('span', 'story-say-text', sayEl);
      fit();
      global.addEventListener('resize', fit);
      // a line laid out in the fallback face is re-measured once the real one is in
      if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function () { if (sayLine) place(sayLine); }, function () {});

    }

    return {
      mount: mount, show: show, sequence: sequence, hide: hideSay, stop: stop,
      beat: beat, cue: cue, toPainting: toPainting, fit: fit,
      setPace: function (k) { paceK = k > 0 ? k : 1; },
      T: T, MOTION: MOTION, W: W, H: H,

  })();

  global.DialogueKit = { Bubble: Bubble, Narration: Narration, Timing: Timing, sfx: sfx };
  global.Bubble = Bubble; global.Narration = Narration; global.Timing = Timing;

/* ======================================================================
   THE DEMO (kit only)
   ====================================================================== */
(function () {
  'use strict';
  var stage = document.getElementById('stage'), speaker = document.getElementById('speaker');
  var hint = document.getElementById('hint');

  Bubble.mount({ host: stage, onTerm: function (term) { hint.textContent = 'key word: ' + term; } });
  Narration.mount({ host: stage, target: speaker });

  /* the speaker's head (game.js headPoint: the top 18% of the drawn box) */
  function head() { return { x: speaker.offsetLeft + speaker.offsetWidth / 2, y: speaker.offsetTop + speaker.offsetHeight * 0.18 }; }
  function aim() { var h = head(); Bubble.aimAt(h.x, h.y); }
  aim();
  window.addEventListener('resize', aim);

  /* the lesson's own lines (screens.js), the second one in three bubbles */
  var LINES = [
    { say: 'Drag the line segment to a different vertex.' },
    { speak: ['A line segment joining', 'two non-adjacent vertices', 'is a diagonal.'] },
    { say: 'Hmm… The sides look suspiciously alike.' },
    { say: 'Which of these are polygons?' }
  ];
  var li = 0;
  document.getElementById('btn-say').addEventListener('click', function () {
    var L = LINES[li++ % LINES.length];
    Narration.stop();          // in the game the story and the lesson's bubble are never up together
    aim(); hint.textContent = '';
    if (L.speak) Bubble.speak(L.speak, 'narration').then(function () { hint.textContent = 'line done (read, then the pause)'; });
    else Bubble.say(L.say).then(function (early) { hint.textContent = early ? 'finished by a tap' : 'words in'; });
  });

  /* the story's scene 1 (story-data.js), the bubbles aimed at the placeholder */
  function tipAtSpeaker() { return Narration.toPainting(speaker.offsetLeft + speaker.offsetWidth / 2, speaker.offsetTop); }
  var SAMPLE = {
    narrator: function () {
      return { who: 'narrator', box: { x: 110, top: 34 },
        // each perks up as he is named — who is who, before either speaks
        at: [{ word: 'Momo', as: 'perk', after: 120 }, { word: 'Popo', as: 'perk', after: 120 }],
        parts: ['It was a great day,', 'and Momo and Popo were deciding what to do.'], key: ['great', 'day,', 'Momo', 'Popo'],
        text: 'It was a great day, and Momo and Popo were deciding what to do.' };
    },
    momo: function () {
      var tip = tipAtSpeaker();
      return { who: 'momo', box: { cx: tip[0] - 100, bottom: tip[1] - 44 }, tip: tip,
        start: [{ as: 'hop' }, { as: 'lift', after: 120 }],
        // "picnic!" — a beat — and Popo's ears go up before he has a word to say
        at: [{ word: 'picnic!', as: 'perk', after: 320, sfx: 'pop', level: 0.18 }],
        key: ['picnic!'],
        text: 'Popo, let’s go for a picnic!' };
    },
    popo: function () {
      var tip = tipAtSpeaker();
      return { who: 'popo', box: { cx: tip[0] + 98, bottom: tip[1] - 42 }, tip: tip,
        start: [{ as: 'hop' }, { as: 'wave', after: 160 }],
        at: [{ word: 'idea,', as: 'proud', after: 380 }],
        key: ['Great', 'idea,'],
        text: 'Great idea, Momo!' };
    }
  };
  document.getElementById('btn-narrate').addEventListener('click', function () {
    var who = document.getElementById('who').value;
    Bubble.hide();
    hint.textContent = '';
    // one line as a scene: shown, held (lastHold 700), and gone by itself 500ms later
    Narration.sequence([SAMPLE[who]()]).then(function (ok) { if (ok) hint.textContent = 'scene told, went on by itself'; });
  });
})();
</script>
