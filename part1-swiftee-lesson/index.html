  :root {
    --ink: #1c2a4a;
    --sans: "Nunito", "Segoe UI", system-ui, sans-serif;
    --ink-w: 3px;
    --instruction-text: #174D59;
    --instruction-accent: #ff7a0e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #a9d6f4; font-family: var(--sans);
    color: var(--ink); overflow: hidden;
    user-select: none; -webkit-user-select: none; caret-color: transparent;
  }

  #game { position: fixed; inset: 0; background: #5fbdfa; }   /* under the backdrop; never seen unless an image fails */
  #backdrop {
    position: absolute; inset: 0;
    background: url("assets/bg/ice-vista.webp") center center / cover no-repeat, #5fbdfa;
    background: image-set(url("assets/bg/ice-vista.avif?v=abcf3f2f") type("image/avif"), url("assets/bg/ice-vista.webp") type("image/webp")) center center / cover no-repeat, #5fbdfa;
    pointer-events: none; z-index: 0;
  }
  #stage { position: absolute; inset: 0; z-index: 1; }

  /* Swiftee is an HTML/SVG overlay positioned by game.js */
  .swiftee { z-index: 3; }

  #bubble {
    --bubble-edge:   #169F99;   /* the border; the tail's outline follows it */
    --bubble-paper:  #FFFBEA;   /* the fill; the tail's fill follows it      */
    --bubble-ink:    var(--instruction-text, #174D59);
    --bubble-border: 4px;       /* keep in step with --tail-offset            */
    --bubble-radius: 26px;
    --tail-size:     36px;
    --tail-offset:   5.2px;     /* mouth(12/60 of the size) - border/2        */
    --tail-x:        calc(70% - 18px);
    --tail-y:        calc(50% - 18px);

    position: absolute; z-index: 4;
    isolation: isolate;
    box-sizing: border-box;
    /* One size for the whole component; the padding is em of this. */
    font-size: clamp(18px, calc(2 * var(--svw, 1vw)), 40px);
    max-width: min(820px, calc(68 * var(--svw, 1vw)));
    min-width: 5em;
    padding: .5em .78em;
    display: flex; align-items: center; justify-content: center;
    border: var(--bubble-border) solid var(--bubble-edge);
    border-radius: var(--bubble-radius);
    background: var(--bubble-paper);
    color: var(--bubble-ink);
    box-shadow:
      inset 0 2px 0 #FFFFFF,
      0 0 14px 2px rgb(22 159 153 / .16),
      0 0 30px 8px rgb(22 159 153 / .07),
      0 8px 20px rgb(12 64 78 / .16);
    opacity: 0; pointer-events: none;
    transform: translateY(6px) scale(.94);
    transform-origin: 12% 100%;
    transition: transform 220ms cubic-bezier(.22, 1, .36, 1), opacity 200ms ease-out,
                left 240ms cubic-bezier(.3, .8, .3, 1), top 240ms cubic-bezier(.3, .8, .3, 1);
  }
  #bubble.snap { transition: transform 220ms cubic-bezier(.22, 1, .36, 1), opacity 200ms ease-out; }
  #bubble.pre      { transition: none !important; opacity: 0; transform: translateY(6px) scale(.94); }
  #bubble.pre-swap { transition: none !important; opacity: 0; transform: translateY(5px) scale(.96); }
  #bubble.show.enter { animation: bubbleIn 220ms ease-out backwards; }
  @keyframes bubbleIn {
    0%   { opacity: 0; transform: translateY(6px) scale(.94); }
    60%  { opacity: 1; transform: translateY(0) scale(1.02); }
    100% { opacity: 1; transform: none; }
  }
  /* the small catch-light that keeps the paper playful */
  #bubble::before {
    content: '';
    position: absolute; left: 14px; top: 10px;
    width: .8em; height: .28em; border-radius: 999px;
    background: #fff; transform: rotate(-22deg); pointer-events: none;
  }
  #bubble.show { opacity: 1; pointer-events: auto; cursor: pointer; transform: none; }
  #bubble.show.away, #bubble.show.dim.away { opacity: 0; transform: scale(.94); transition: opacity 200ms ease, transform 200ms ease; }
  #bubble.show.back { animation: bubbleBack 460ms cubic-bezier(.3,1.5,.5,1); }
  @keyframes bubbleBack { 0% { opacity: 0; transform: scale(.9); } 60% { opacity: 1; transform: scale(1.03); } 100% { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #bubble.show.back { animation: none; } #bubble.show.away { transition: none; } }
  #bubble.show.passive { pointer-events: none; cursor: default; }
  #bubble.show.dim { opacity: .82; }
  #bubble.out { opacity: 0; transform: translateY(-4px); transition: transform 170ms ease-in, opacity 170ms ease-in; }

  .dialogue-inner {
    position: relative; z-index: 2; max-width: 100%;
    color: var(--bubble-ink);
    font-family: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", var(--sans);
    font-size: inherit; font-weight: 700; line-height: 1.3;   /* 1.3–1.45 reads comfortably; 1.22 was tight */
    letter-spacing: .2px; text-align: center;
    text-wrap: balance;
  }

  /* ---- the tail ---- */
  .bubble-tail {
    position: absolute;
    width: var(--tail-size); height: var(--tail-size);   /* square: required, so it rotates about its centre */
    overflow: visible; pointer-events: none;
    transform-origin: center;
    z-index: 1;                  /* above the bubble's own border, so the fill hides it */
    left: var(--tail-x); top: calc(100% - var(--tail-offset));
  }
  .bubble-tail-fill   { fill: var(--bubble-paper); }
  .bubble-tail-stroke {
    fill: none; stroke: var(--bubble-edge);
    stroke-width: 6.67;
    stroke-linecap: round; stroke-linejoin: round;
  }
  #bubble[data-tail="bottom"] > .bubble-tail { left: var(--tail-x); top: calc(100% - var(--tail-offset)); transform: none; }
  #bubble[data-tail="top"]    > .bubble-tail { left: var(--tail-x); top: calc(var(--tail-offset) - var(--tail-size)); transform: rotate(180deg); }
  #bubble[data-tail="right"]  > .bubble-tail { left: calc(100% - var(--tail-offset)); top: var(--tail-y); transform: rotate(-90deg); }
  #bubble[data-tail="left"]   > .bubble-tail { left: calc(var(--tail-offset) - var(--tail-size)); top: var(--tail-y); transform: rotate(90deg); }
  #bubble:not([data-tail]) > .bubble-tail { display: none; }
  /* Mirror the tail's sweep without moving it. */
  #bubble[data-tail-flip] > .bubble-tail > g { transform: scale(-1,1); transform-origin: 30px 30px; }

  @media (max-width: 900px) {
    #bubble { font-size: clamp(16px, 2.4vw, 24px); }
  }
  @media (max-width: 600px) {
    #bubble { font-size: clamp(15px, 4.2vw, 21px); }
  }

  @media (prefers-reduced-motion: reduce) {
    #bubble, #bubble.pre, #bubble.pre-swap, #bubble.out { transform: none; }
    #bubble { transition: opacity 200ms ease; }
    #bubble.out { transition: opacity 160ms ease; }
    #bubble.show.enter { animation: none; }
  }

  .bubble-line .w, .bubble-line .dc-term {
    display: inline-block;
    transform-origin: 50% 80%;
    transition: opacity 160ms cubic-bezier(.25,.8,.35,1),
                scale 170ms cubic-bezier(.25,.8,.35,1),
                translate 170ms cubic-bezier(.25,.8,.35,1);
  }
  .bubble-line.revealing .w, .bubble-line.revealing .dc-term { opacity: 0; scale: .96; translate: 0 4px; }
  .bubble-line .w.in, .bubble-line .dc-term.in { opacity: 1; scale: 1; translate: 0 0; }
  @media (prefers-reduced-motion: reduce) {
    .bubble-line .w, .bubble-line .dc-term { transition: opacity 120ms ease-out; scale: 1; translate: 0 0; }
    .bubble-line.revealing .w:not(.in), .bubble-line.revealing .dc-term:not(.in) { translate: 0 0; scale: 1; }
  }

  .dc-term {
    position: relative; isolation: isolate;
    display: inline-block; vertical-align: top;
    padding: 0; margin: 0;
    font-size: 1.07em; line-height: 1.215;
    font-weight: 800; white-space: nowrap;
  }
  .dc-ink {
    display: inline-block;
    color: var(--instruction-accent, #B84A00);
    text-shadow: 0 1px 0 rgba(120, 40, 0, .16);
  }
  .bubble-line.revealing .dc-term.in { animation: dcTermPop 220ms cubic-bezier(.22, 1, .36, 1) both; }
  @keyframes dcTermPop {
    0%   { scale: .92; }
    60%  { scale: 1.06; }
    100% { scale: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble-line.revealing .dc-term.in { animation: none; }
  }
  #instruction .dc-ink { color: #0f4fc0; background: none; -webkit-text-fill-color: currentColor; filter: none; }
  .dc-keep { white-space: nowrap; }

  #stage .touchable { transition: filter .14s ease, translate .14s ease; }
  #stage .touchable:hover {
    filter: drop-shadow(0 0 7px rgba(255, 181, 21, .9));
    translate: 0 -3px;
  }
  #stage .touchable:active {
    filter: drop-shadow(0 0 3px rgba(255, 181, 21, .7));
    translate: 0 3px;
  }
  #stage .zone.touchable:hover { filter: none; translate: 0; }
  #stage .card.touchable:hover, #stage .card.touchable:active { translate: 0; }

  #stage .edge.hint { stroke: transparent; }
  #stage .side-todo { stroke-opacity: .35; }
  @keyframes sideTodo { 0%, 100% { stroke-opacity: .22; } 50% { stroke-opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { #stage .side-todo { animation: none; stroke-opacity: .6; } }
  /* a bird on a mark with no ground under it bobs on the air */
  .swiftee.air { animation: hoverBob 2.6s ease-in-out infinite; }
  @keyframes hoverBob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
  #stage .knob.hint {
    transform-box: fill-box; transform-origin: center;
    filter: drop-shadow(0 0 4px rgba(75, 224, 255, .85));
  }
  #stage .knob.breathe { transform-box: fill-box; transform-origin: center; animation: knobBreathe 1.6s ease-in-out infinite; }
  @keyframes knobBreathe {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(75, 224, 255, 0)); }
    50% { transform: scale(1.3); filter: drop-shadow(0 0 6px rgba(75, 224, 255, .95)); }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage .knob.breathe { animation: none; filter: drop-shadow(0 0 4px rgba(75, 224, 255, .85)); }
  }
  #stage .angle-todo { opacity: .6; }
  #stage .angle-todo[data-todo="1"] { animation-delay: .22s; } #stage .angle-todo[data-todo="2"] { animation-delay: .44s; }
  #stage .angle-todo[data-todo="3"] { animation-delay: .66s; } #stage .angle-todo[data-todo="4"] { animation-delay: .88s; }
  @keyframes angleTodo {
    0%, 100% { opacity: .55; filter: drop-shadow(0 0 0 rgba(255, 211, 90, 0)); }
    50% { opacity: 1; filter: drop-shadow(0 0 5px rgba(255, 211, 90, .9)); }
  }
  @media (prefers-reduced-motion: reduce) { #stage .angle-todo { animation: none; opacity: .9; } }
  #stage .focus-ring { transition: opacity 320ms ease; filter: drop-shadow(0 0 6px rgba(255, 194, 60, .8)); }
  @media (hover: hover) and (pointer: fine) {
    #stage .card .shape-card, #stage .choice { transform-box: fill-box; transform-origin: center; transition: transform .16s ease-out; }
    #stage .card:not(.card-off):hover .shape-card, #stage .choice:hover { transform: scale(1.03); }
    #stage .card:not(.card-off):active .shape-card, #stage .choice:active { transform: scale(1.0); transition-duration: .06s; }
  }
  #stage .teach-sheet { position: absolute; inset: 0; z-index: 2; pointer-events: auto;
    background: rgba(2, 10, 26, 0); -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0);
    transition: background .35s ease, -webkit-backdrop-filter .35s ease, backdrop-filter .35s ease; }
  #stage .teach-sheet.on { background: rgba(2, 10, 26, .42); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  #stage .teach-sheet > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #stage .teach-ring { transform-box: fill-box; transform-origin: center; animation: teachRing 1.1s ease-in-out infinite; }
  @keyframes teachRing { 0%, 100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.4); opacity: .5; } }
  #stage .teach-spark { transform-box: fill-box; transform-origin: center; animation: teachSpark .9s ease-out both; }
  @keyframes teachSpark { 0% { transform: scale(0); opacity: 0; } 40% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #stage .teach-ring, #stage .teach-spark { animation: none; }
    #stage .teach-sheet { transition: none; }
  }
  #stage .card.card-off { opacity: .5; filter: grayscale(.55); pointer-events: none; transition: opacity .35s ease, filter .35s ease; }
  #stage .zone.hint { filter: drop-shadow(0 0 8px rgba(255, 255, 255, .6)); }
  #stage .zone.landed { animation: zoneLand .65s ease-out; }
  @keyframes zoneLand {
    0% { filter: drop-shadow(0 0 0 #fff) brightness(1); }
    30% { filter: drop-shadow(0 0 24px #fff) brightness(1.2); }
    100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)) brightness(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .swiftee.air { animation: none; }
    #stage .zone.hint, #stage .zone.landed { animation: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage .touchable { transition: none; }
    #stage .touchable:hover { translate: 0; }
  }

  #jump {
    position: fixed; top: 6px; left: 52%; z-index: 60;
    max-width: calc(48vw - 96px);
    display: flex; align-items: center; gap: 6px;
    padding: 4px 6px; border-radius: 999px;
    background: rgba(10, 30, 60, .82); box-shadow: 0 2px 10px rgba(0, 0, 0, .3);
    font: 600 13px/1 system-ui, sans-serif; color: #fff;
    opacity: .85; transition: opacity .18s ease;
  }
  #jump[hidden] { display: none; }
  #jump:hover, #jump:focus-within { opacity: 1; }
  #jump .dev-tag {
    padding: 5px 8px; border-radius: 999px; background: #ff7a0e; color: #fff;
    font-weight: 800; letter-spacing: .06em;
  }
  #jump .dev-step {
    width: 30px; height: 30px; flex: none; border: 0; border-radius: 50%;
    font: inherit; color: #0a1e3c; background: #eaf6ff; cursor: pointer;
  }
  #jump .dev-go {
    display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px;
    color: #0a1e3c; background: #eaf6ff; text-decoration: none; white-space: nowrap;
  }
  #jump .dev-step:hover, #jump .dev-go:hover { background: #fff; }
  #jump select {
    min-width: 0; width: 100%; max-width: 240px; height: 30px;
    font: inherit; color: #0a1e3c;
    background: #fff; border: 0; border-radius: 8px;
    padding: 0 6px; cursor: pointer;
  }
  @media (max-width: 680px) {
    #jump { left: auto; right: 6px; top: 98px; max-width: 46vw; }
  }

  #instruction {
    position: absolute; z-index: 5;
    left: 50%; transform: translateX(-50%);
    top: clamp(6px, 1.2vh, 18px);
    box-sizing: border-box;
    width: max-content;
    min-width: 0;
    max-width: min(calc(100 * var(--svw, 1vw) - 270px), 1200px);   /* never under the HUD buttons, at any width */
    height: auto;

    border-style: solid;
    border-width: clamp(26px, calc(3.4 * var(--svw, 1vw)), 62px) clamp(46px, calc(5.2 * var(--svw, 1vw)), 96px) clamp(18px, calc(2.4 * var(--svw, 1vw)), 44px);
    border-image-source: url("assets/ui/plank.webp?v=ef53d389");
    border-image-source: image-set(url("assets/ui/plank.avif?v=cc10196e") type("image/avif"), url("assets/ui/plank.webp?v=ef53d389") type("image/webp"));
    border-image-slice: 120 270 90 270 fill;
    border-image-repeat: stretch;

    padding: 0 clamp(4px, calc(.8 * var(--svw, 1vw)), 14px) clamp(2px, calc(.4 * var(--svw, 1vw)), 8px);
    font-family: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", var(--sans);
    font-size: clamp(18px, calc(2 * var(--svw, 1vw)), 34px); font-weight: 600;
    line-height: 1.24; letter-spacing: .2px; text-align: center;
    color: #5a3410;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .55);

    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
  }
  #instruction.show { opacity: 1; }
  #instruction { isolation: isolate; }
  /* the plank's words arriving with its voice (instruction.js voice) */
  #instruction .pw { opacity: 0; transition: opacity .16s ease; }
